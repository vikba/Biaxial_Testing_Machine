name: Python checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install . build
      - run: python -m compileall -q main.py biaxial_testing_machine tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python "${{ github.workspace }}/tests/package_smoke.py"
          python "${{ github.workspace }}/tests/package_smoke.py" module
